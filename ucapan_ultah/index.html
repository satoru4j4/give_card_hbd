<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Surprise</title>

    <!-- FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CONFETTI -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- BACKGROUND GLOW -->
    <div class="bg-glow"></div>

    <!-- FLOAT ICONS -->
    <div class="floating">
        <i class="fa-solid fa-star"></i>
        <i class="fa-solid fa-gift"></i>
        <i class="fa-solid fa-cake-candles"></i>
        <i class="fa-solid fa-heart"></i>
        <i class="fa-solid fa-music"></i>
    </div>

    <!-- APP WRAPPER -->
    <main class="app">

        <!-- INPUT SCREEN -->
        <section class="screen active" id="inputScreen">

        <div class="card">

            <div class="icon">
            <i class="fa-solid fa-cake-candles"></i>
            </div>

            <h1>Birthday Surprise</h1>

            <p>Masukkan nama spesial kamu</p>

            <div class="input-group">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="nameInput" placeholder="Nama kamu">
            </div>

            <button onclick="start()">
            <i class="fa-solid fa-gift"></i>
            Buka Surprise
            </button>

        </div>

        </section>

        <!-- BIRTHDAY SCREEN -->
        <section class="screen hidden" id="birthdayScreen">

        <div class="icon-big">
            <i class="fa-solid fa-cake-candles"></i>
        </div>

        <img src="asset/hbd1.gif" class="gif-main">

        <h1 id="text"></h1>

        <p class="desc">
            Di hari spesial ini, aku berharap semesta selalu menjaga langkahmu, menenangkan hatimu, dan mengiringi setiap mimpimu menjadi nyata. <br>
                Terima kasih sudah menjadi bagian penting dalam cerita hidup ini.
        </p>

        <img src="asset/hbd2.gif" class="gif-small">

        </section>

    </main>

    <audio id="music" loop>
        <source src="asset/backsound_hbd.mp3" type="audio/mp3">
    </audio>

    <script src="script.js"></script>

</body>

</html>
